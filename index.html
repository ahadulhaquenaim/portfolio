<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahad — Software Engineer. A Solo Leveling themed animated portfolio: developer, designer, problem solver."
    />
    <title>Ahad · The Monarch's Awakening</title>

    <!-- Start the hero poster download before the JS bundle boots, so the
         gate intro reveals real art on a cold first visit. Mirrors
         heroVideo in src/theme/palette.ts — keep the two in sync. -->
    <script>
      (function () {
        var theme = "solo";
        try {
          if (localStorage.getItem("portfolio-theme") === "dbz") theme = "dbz";
        } catch (e) {}
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.fetchPriority = "high";
        link.href =
          "%BASE_URL%videos/posters/" +
          (theme === "dbz" ? "turning-goku" : "hero-character") +
          ".webp";
        document.head.appendChild(link);
      })();
    </script>

    <!-- RPG fonts: Cinzel (headings) + Rajdhani (HUD/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
